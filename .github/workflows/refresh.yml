name: Parlay Lab – refresh picks

on:
  schedule:
    # 9am, 1pm, 5pm and 7pm US Eastern (during daylight time): morning board, then
    # refreshes as injury news, lineups and starting pitchers come in.
    - cron: "0 13,17,21,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: parlay-lab
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Recalibrate from backtest
        run: python backtest.py

      - name: Price today's board and grade finished picks
        run: python run.py

      - name: Save results history and picks
        run: |
          git config user.name "parlay-lab-bot"
          git config user.email "parlay-lab-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Refresh picks $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
