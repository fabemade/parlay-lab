name: Parlay Lab – refresh picks

on:
  schedule:
    # Every 30 minutes from about 8am to 1:30am US Eastern, so prices, injuries, lineups
    # and starting pitchers are never more than ~30 minutes stale. (GitHub may start
    # scheduled runs a few minutes late when it's busy.)
    - cron: "0,30 12-23,0-5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: parlay-lab
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Recalibrate from backtest
        run: python backtest.py

      - name: Price today's board and grade finished picks
        run: python run.py

      - name: Save results history and picks
        run: |
          git config user.name "parlay-lab-bot"
          git config user.email "parlay-lab-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh picks $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push

      # The board (site/data) is published straight to the website, not committed, so the
      # repo doesn't grow by ~11 MB every half hour. Old links to /site/ keep working.
      - name: Keep old /site/ links working
        run: |
          mkdir -p site/site
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><script>location.replace("../"+location.search+location.hash)</script>' > site/site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
